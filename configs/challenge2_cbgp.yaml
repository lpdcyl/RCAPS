# Frozen after predeclared small-scale sanity checks.  These are simulator
# controls, not values fitted to individual Phase 3.5 result points.
bottleneck_utilization_threshold: 0.85

# The profiled serving model supports 8/16/24-layer intervals, so an 8-layer
# shift is the smallest non-zero boundary move usable by every GPU type.
