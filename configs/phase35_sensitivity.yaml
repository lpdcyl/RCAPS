# Phase 3.5 scenarios are synthetic, predeclared sensitivity cases.  They are
# simulator assumptions, not measurements or claims about production clusters.
baseline:
  gpu_scenario: symmetric
  rho: 0.95
  capacity_tokens_per_second: 30

rho_values: [0.90, 0.95, 0.98, 1.00]

gpu_scenarios:
  symmetric:
    c1: A100
    c2: L4
    c3: T4
    c4: A100
    c5: L4
    c6: T4
  moderate_asymmetric:
    c1: A100
    c2: L4
    c3: T4
    c4: L4
    c5: T4
    c6: T4
  high_asymmetric:
    c1: A100
    c2: A100
    c3: L4
    c4: L4
    c5: T4
    c6: T4
  commodity_region:
    c1: A100
    c2: L4
    c3: T4
    c4: T4
    c5: T4
    c6: T4

network:
  capacity_tokens_per_second: [1, 2, 5, 10, 20, 30, 50, 100]

energy_sensitivity:
  status: synthetic_energy_sensitivity
  gpu_types: [A100, L4, T4]
  multipliers: [0.75, 1.0, 1.25]

boundary:
  degeneracy_relative_tolerance: 0.0001

outputs:
  summary_csv: results/phase35_summary.csv
  boundaries_csv: results/phase35_validated_boundaries.csv
  cost_curves_csv: results/phase35_placement_cost_curves.csv
  cost_curves_figure: results/phase35_placement_cost_curves.png
  rho_csv: results/phase35_rho_sensitivity.csv
  rho_figure: results/phase35_rho_sensitivity.png
  gpu_csv: results/phase35_gpu_sensitivity.csv
  gpu_figure: results/phase35_gpu_sensitivity.png
  network_csv: results/phase35_network_sensitivity.csv
  network_figure: results/phase35_network_sensitivity.png
  energy_csv: results/phase35_energy_sensitivity.csv
