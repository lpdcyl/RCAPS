network_topology: network_topology.yaml
throughput_provider: profiled
rho: 0.95
phase: decode
batch_size: 1

carbon:
  fixed_regions:
    B: 200.0
  sweep:
    region: A
    start: 50.0
    stop: 800.0
    step: 25.0

routing_gap_epsilon: 0.03
routing_gap_sensitivity: [0.01, 0.03, 0.05]

# For 16,000-byte activations these are 5, 10, 20, 30, 50, 100 token/s.
cross_region_bandwidth_mbps: [0.64, 1.28, 2.56, 3.84, 6.40, 12.80]

outputs:
  helix_routing_csv: results/phase3_helix_carbon_routing.csv
  strategy_sweep_csv: results/phase3_strategy_sweep.csv
  routing_breakpoints_csv: results/phase3_routing_breakpoints.csv
  placement_breakpoints_csv: results/phase3_placement_breakpoints.csv
  transition_figure: results/phase3_transition.png
  phase_diagram_csv: results/phase3_phase_diagram.csv
  phase_diagram_figure: results/phase3_phase_diagram.png
