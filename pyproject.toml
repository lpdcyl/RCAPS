[project]
name = "carbon-helix-sim"
version = "0.1.0"
description = "Trace-driven Helix-style serving simulator"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2,<4",
    "PyYAML>=6.0,<7",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
